name: Web validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/staging-smoke.mjs
      - run: npm run verify

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production API Docker image
        run: docker build -f Dockerfile.api -t qboclone-api:${{ github.sha }} .
      - name: Verify Docker image runs without root
        run: |
          test "$(docker image inspect qboclone-api:${{ github.sha }} --format '{{.Config.User}}')" = "node"
