name: PostgreSQL ledger integration
on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap synthetic auth schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_bootstrap.sql
      - name: Apply ordered accounting migrations
        shell: bash
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Mirror Supabase service-role table grants in test database
        run: psql -X -v ON_ERROR_STOP=1 -c "grant all on all tables in schema public to service_role; grant all on all sequences in schema public to service_role"
      - name: Run Milestone 2 SQL regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone2_regression.sql
      - name: Run Milestone 3 SQL regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone3_regression.sql
      - name: Run Milestone 4 SQL regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone4_regression.sql
      - name: Run Milestone 5 SQL regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone5_regression.sql
      - name: Run Milestone 6 accounting regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone6_regression.sql
      - name: Run Milestone 6 extended ledger regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone6_extended_regression.sql
      - name: Run Milestone 7 automation regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone7_regression.sql
      - name: Run Milestone 7 OCR quota regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone7_ocr_regression.sql
      - name: Run Milestone 7 reminder regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone7_reminders_regression.sql
      - name: Run Milestone 8 bank feed and migration regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone8_regression.sql
      - name: Run Milestone 8 extended financial migration regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone8_extended_regression.sql
      - name: Run Milestone 9 FIFO inventory regression
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/milestone9_inventory_regression.sql
      - name: Verify database backup and disaster recovery restore
        shell: bash
        run: |
          set -euo pipefail
          pg_dump -Fc --no-owner --no-acl -f /tmp/ledger-ci.backup postgres
          createdb qboclone_restore_ci
          pg_restore --no-owner --no-acl -d qboclone_restore_ci /tmp/ledger-ci.backup
          psql -X -v ON_ERROR_STOP=1 -d qboclone_restore_ci -c "select count(*) from public.subscription_plans"
